<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Burger - Меню</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #131313; color: #ffffff; font-family: sans-serif; }
        .card-bg { background-color: #1e1e1e; }
        .tg-button { background-color: #ffcc00; color: #000000; }
    </style>
</head>
<body class="p-4 pb-32">
    <h1 class="text-3xl font-black text-amber-500 text-center my-6">JUST BURGER</h1>
    <div id="menu-container" class="grid grid-cols-1 gap-4 max-w-md mx-auto"></div>
    <div class="fixed bottom-0 left-0 right-0 p-4 card-bg border-t border-zinc-800 shadow-2xl z-50">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div>
                <div class="text-xs text-zinc-400">Всього:</div>
                <div class="text-2xl font-black text-amber-500"><span id="cart-total">0</span> ₴</div>
            </div>
            <button class="bg-green-600 text-white px-8 py-3 rounded-xl font-black" onclick="alert('Замовлення оформлено!')">Оформити</button>
        </div>
    </div>
    <script>
        const MENU_ITEMS = [
            { id: 1, name: "Бургер Класик", price: 160, description: "Яловича котлета, томати, салат, сир Чеддер.", imageUrl: "https://justburger.ps.me/wp-content/uploads/2023/10/classic.jpg" },
            { id: 2, name: "Бургер BBQ", price: 180, description: "Бекон, цибуля, сир Чеддер, соус барбекю.", imageUrl: "https://justburger.ps.me/wp-content/uploads/2023/10/bbq.jpg" },
            { id: 3, name: "Картопля Фрі", price: 60, description: "Хрустка золотиста картопля з сіллю.", imageUrl: "https://justburger.ps.me/wp-content/uploads/2023/10/fries.jpg" }
        ];
        const container = document.getElementById('menu-container');
        container.innerHTML = MENU_ITEMS.map(item => `
            <div class="card-bg rounded-2xl p-3 flex items-center gap-4 border border-zinc-800">
                <img src="${item.imageUrl}" class="w-20 h-20 rounded-lg object-cover bg-zinc-900" onerror="this.src='https://placehold.co/80x80?text=JustBurger'">
                <div class="flex-1">
                    <h3 class="font-bold">${item.name}</h3>
                    <p class="text-xs text-zinc-400">${item.description}</p>
                    <div class="text-amber-500 font-bold mt-1">${item.price} ₴</div>
                </div>
                <button class="tg-button px-4 py-2 rounded-lg font-bold text-sm" onclick="alert('Додано ${item.name}')">Додати</button>
            </div>
        `).join('');
    </script>
</body>
</html>

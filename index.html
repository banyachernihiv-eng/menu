<!DOCTYPE html>
<html lang="uk" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Just Burger - Меню</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .card-bg { background-color: #1e1e1e; }
    .tg-button { background-color: #ffcc00; color: #000000; }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }
  </style>
</head>
<body class="bg-zinc-950 text-gray-100 flex flex-col h-full overflow-hidden select-none">

  <!-- ВБУДОВАНА ПАНЕЛЬ НАЛАГОДЖЕННЯ (Показує помилки прямо на екрані телефону) -->
  <div id="debug-panel" class="bg-red-950/80 border-b border-red-800 px-4 py-2 text-[10px] font-mono text-red-200 hidden z-[200]">
    <div class="flex justify-between items-center mb-1">
      <span class="font-bold text-red-400">⚠️ Системний лог помилок:</span>
      <button onclick="document.getElementById('debug-panel').classList.add('hidden')" class="text-white bg-red-800 px-1.5 py-0.5 rounded text-[8px]">Сховати</button>
    </div>
    <div id="debug-logs-container" class="max-h-20 overflow-y-auto space-y-1"></div>
  </div>

  <!-- Шапка меню -->
  <header class="bg-zinc-900 border-b border-zinc-800 px-4 py-4 flex items-center justify-between sticky top-0 z-40 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-amber-500/10 flex items-center justify-center border border-amber-500/20 text-amber-500 font-bold text-xl">
        🍔
      </div>
      <div>
        <h1 class="font-black text-sm tracking-wider text-amber-500 uppercase">JUST BURGER</h1>
        <p class="text-[10px] text-zinc-400 uppercase tracking-widest">Premium Street Food</p>
      </div>
    </div>
    <div class="bg-zinc-800 text-amber-500 px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5 border border-zinc-700">
      <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
      Тест каси
    </div>
  </header>

  <!-- Список бургерів -->
  <main class="flex-1 overflow-y-auto px-4 py-4 pb-28 space-y-4">
    <div class="grid grid-cols-1 gap-4" id="menu-grid"></div>
  </main>

  <!-- Кнопка кошика внизу -->
  <div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-zinc-950 via-zinc-950/95 to-transparent border-t border-zinc-900/40 z-30 pointer-events-none">
    <button id="cart-button" class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-4 px-6 rounded-2xl transition-all duration-300 flex items-center justify-between shadow-lg shadow-amber-500/20 transform active:scale-[0.98] pointer-events-auto hidden" onclick="toggleCart()">
      <div class="flex items-center gap-2">
        <span class="bg-zinc-950 text-amber-500 rounded-lg px-2.5 py-0.5 text-xs font-black" id="cart-count">0</span>
        <span class="text-sm font-extrabold">Переглянути замовлення</span>
      </div>
      <span class="text-sm font-black" id="cart-total">0 ₴</span>
    </button>
  </div>

  <!-- Шторка кошика -->
  <div id="cart-drawer" class="fixed inset-0 bg-zinc-950/80 backdrop-blur-sm z-50 transform translate-y-full transition-transform duration-300 ease-in-out flex flex-col justify-end">
    <div class="bg-zinc-900 rounded-t-3xl max-h-[90vh] flex flex-col border-t border-zinc-800">
      
      <div class="px-5 py-4 border-b border-zinc-800 flex justify-between items-center">
        <div>
          <h2 class="text-lg font-bold text-gray-100 flex items-center gap-2">
            🛒 Твій кошик
          </h2>
          <p class="text-xs text-zinc-400">Перевір вибрані позиції</p>
        </div>
        <button onclick="toggleCart()" class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white transition">
          ✕
        </button>
      </div>

      <div class="p-5 overflow-y-auto space-y-4 max-h-[40vh]" id="cart-items-container"></div>

      <div class="p-5 bg-zinc-950/40 border-t border-b border-zinc-800/60 space-y-3">
        <h3 class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider">Дані для відправки в касу</h3>
        <input type="tel" id="cust-phone" placeholder="Введіть ваш номер телефону" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-sm text-gray-100 placeholder-zinc-500 focus:outline-none focus:border-amber-500 transition">
      </div>

      <div class="p-5 space-y-4 bg-zinc-900">
        <div class="flex justify-between items-center">
          <span class="text-zinc-400 text-sm">Всього до сплати:</span>
          <span class="text-xl font-black text-amber-500" id="drawer-total">0 ₴</span>
        </div>
        <button onclick="sendOrderToPoster()" class="w-full bg-green-600 hover:bg-green-500 text-white font-black py-4 rounded-2xl transition duration-300 shadow-md flex items-center justify-center gap-2 active:scale-95">
          <span>Надіслати замовлення</span>
          <span>⚡</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ВЛАСНЕ СТИЛЬНЕ ВІКНО УСПІХУ (Не заблокується жодним додатком) -->
  <div id="custom-success-modal" class="fixed inset-0 bg-zinc-950/90 backdrop-blur-md z-[100] flex items-center justify-center p-4 hidden">
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 max-w-sm w-full text-center space-y-5 shadow-2xl">
      <div class="w-16 h-16 bg-green-500/10 text-green-500 border border-green-500/20 rounded-full flex items-center justify-center text-3xl mx-auto">
        ✓
      </div>
      <div>
        <h3 class="text-lg font-black text-gray-100 mb-1">Замовлення сформовано!</h3>
        <p class="text-xs text-zinc-400 leading-relaxed" id="modal-success-text">
          Дані успішно оброблені та готові для відправки.
        </p>
      </div>
      <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 text-left space-y-2 text-xs text-zinc-300">
        <div class="flex justify-between"><span class="text-zinc-500">Номер телефону:</span> <span id="modal-phone-val" class="font-bold"></span></div>
        <div class="flex justify-between"><span class="text-zinc-500">Сума до сплати:</span> <span id="modal-total-val" class="font-extrabold text-amber-500"></span></div>
        <div class="flex justify-between"><span class="text-zinc-500">Статус:</span> <span class="text-green-400 font-bold">Очікує каси Poster</span></div>
      </div>
      <button onclick="closeSuccessModal()" class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 py-3 rounded-xl text-sm font-black transition active:scale-95">
        Зрозуміло
      </button>
    </div>
  </div>

  <script>
    // Функція безпечного запису логів на екран
    function logDebug(message) {
      console.log("[DEBUG]", message);
      const panel = document.getElementById('debug-panel');
      const container = document.getElementById('debug-logs-container');
      if (panel && container) {
        panel.classList.remove('hidden');
        const logLine = document.createElement('div');
        logLine.className = 'border-b border-red-900/30 pb-0.5';
        logLine.innerText = `> ${message}`;
        container.appendChild(logLine);
        container.scrollTop = container.scrollHeight;
      }
    }

    // Перехоплюємо глобальні помилки скрипта
    window.onerror = function(message, source, lineno, colno, error) {
      logDebug(`Критична помилка JS: ${message} (Рядок: ${lineno})`);
      return false;
    };

    let tg = null;
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        logDebug("Telegram WebApp SDK успішно ініціалізовано.");
      } else {
        logDebug("Telegram SDK не знайдено (запуск у звичайному браузері).");
      }
    } catch (e) {
      logDebug("Помилка ініціалізації SDK: " + e.message);
    }

    const menuData = [
      {
        id: 54,
        name: "Burger Big",
        price: 395,
        desc: "Подвійна порція смаку для справжніх гурманів! Дві соковиті котлети з яловичини, хрусткий бекон, свіжі томати, листя салату та розплавлений сир Чеддер.",
        image: "https://img.postershop.me/cdn-cgi/image/width=390,format=webp/https://img.postershop.me/24704/e64604c7-4e41-4bfd-810e-734aadf8bd03_image.png"
      },
      {
        id: 55,
        name: "Burger Jack",
        price: 298,
        desc: "Глибокий, насичений смак! Повітряна булочка бріош, фірмовий соус Jack Daniel's, хрустка цибуля та карамелізований бекон.",
        image: "https://img.postershop.me/cdn-cgi/image/width=390,format=webp/https://img.postershop.me/24704/10ffa961-88af-4d02-b9fb-ecbbd49f96e2_image.png"
      },
      {
        id: 56,
        name: "Burger Black (spicy)",
        price: 265,
        desc: "Справжній вибух смаку! Фірмова чорна булочка, гострий соус халапеньо, свіжі овочі та розплавлений Чеддер для справжньої гостроти.",
        image: "https://img.postershop.me/cdn-cgi/image/width=390,format=webp/https://img.postershop.me/24704/b7446fd4-5bca-4d12-ae33-3102784b93a2_image.jpeg"
      },
      {
        id: 30,
        name: "Burger Classic",
        price: 248,
        desc: "Ніжний та насичений! Повітряна булочка бріош, класична соковита котлета з індички, соус тар-тар та свіжий лист салату.",
        image: "https://img.postershop.me/cdn-cgi/image/width=390,format=webp/https://img.postershop.me/24704/fff41153-4f5a-44e5-bfd9-01f16f089fef_image.png"
      }
    ];

    let cart = {};

    function renderMenu() {
      try {
        const grid = document.getElementById('menu-grid');
        grid.innerHTML = '';

        menuData.forEach(item => {
          const count = cart[item.id] || 0;
          const card = document.createElement('div');
          card.className = 'bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-md flex flex-col';
          card.innerHTML = `
            <div class="relative w-full aspect-[4/3] bg-zinc-950 flex items-center justify-center overflow-hidden">
              <img src="${item.image}" alt="${item.name}" class="object-contain w-full h-full p-2 transition-transform duration-500 hover:scale-105" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect width=%22100%22 height=%22100%22 fill=%22%2318181b%22/><text x=%2250%25%22 y=%2250%25%22 font-size=%2240%22 text-anchor=%22middle%22 dy=%22.3em%22>🍔</text></svg>'"/>
            </div>
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div class="space-y-1">
                <div class="flex justify-between items-start gap-2">
                  <h2 class="font-bold text-base text-gray-100 leading-tight">${item.name}</h2>
                  <span class="text-sm font-black text-amber-500 whitespace-nowrap">${item.price} ₴</span>
                </div>
                <p class="text-[11px] text-zinc-400 leading-relaxed">${item.desc}</p>
              </div>
              <div class="mt-4 pt-3 border-t border-zinc-800/80 flex items-center justify-between">
                <span class="text-[10px] text-zinc-500 uppercase tracking-wider">Ціна за одиницю</span>
                <div class="flex items-center">
                  ${count === 0 ? `
                    <button onclick="addToCart(${item.id})" class="tg-button hover:bg-amber-400 active:scale-95 transition-all text-zinc-950 font-black px-5 py-2.5 rounded-xl text-xs flex items-center gap-1.5">
                      <span>Додати</span>
                      <span class="text-sm font-extrabold">+</span>
                    </button>
                  ` : `
                    <div class="bg-zinc-800 border border-zinc-700 rounded-xl flex items-center p-1 overflow-hidden">
                      <button onclick="removeFromCart(${item.id})" class="w-8 h-8 rounded-lg flex items-center justify-center text-red-400 hover:bg-zinc-700 active:scale-90 transition font-black text-sm">-</button>
                      <span class="px-3 text-xs font-bold text-gray-200 min-w-[28px] text-center">${count}</span>
                      <button onclick="addToCart(${item.id})" class="w-8 h-8 rounded-lg flex items-center justify-center text-amber-500 hover:bg-zinc-700 active:scale-90 transition font-black text-sm">+</button>
                    </div>
                  `}
                </div>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
        updateCartUI();
      } catch (e) {
        logDebug("Помилка рендерингу меню: " + e.message);
      }
    }

    function addToCart(id) {
      const item = menuData.find(m => m.id == id);
      if (!item) return;
      cart[id] = (cart[id] || 0) + 1;
      renderMenu();
    }

    function removeFromCart(id) {
      if (cart[id] && cart[id] > 0) {
        cart[id]--;
        if (cart[id] === 0) delete cart[id];
      }
      renderMenu();
    }

    function updateCartUI() {
      let totalCount = 0;
      let totalPrice = 0;
      Object.keys(cart).forEach(id => {
        const item = menuData.find(m => m.id == id);
        if (item) {
          totalCount += cart[id];
          totalPrice += item.price * cart[id];
        }
      });

      const cartBtn = document.getElementById('cart-button');
      const cartCountSpan = document.getElementById('cart-count');
      const cartTotalSpan = document.getElementById('cart-total');

      if (totalCount > 0) {
        cartBtn.classList.remove('hidden');
        cartCountSpan.innerText = totalCount;
        cartTotalSpan.innerText = `${totalPrice} ₴`;
      } else {
        cartBtn.classList.add('hidden');
        document.getElementById('cart-drawer').classList.add('translate-y-full');
      }
      document.getElementById('drawer-total').innerText = `${totalPrice} ₴`;
    }

    function toggleCart() {
      const drawer = document.getElementById('cart-drawer');
      const isClosed = drawer.classList.contains('translate-y-full');
      if (isClosed) {
        renderCartItems();
        drawer.classList.remove('translate-y-full');
      } else {
        drawer.classList.add('translate-y-full');
      }
    }

    function renderCartItems() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';
      let hasItems = false;
      Object.keys(cart).forEach(id => {
        const item = menuData.find(m => m.id == id);
        const count = cart[id];
        if (item && count > 0) {
          hasItems = true;
          const element = document.createElement('div');
          element.className = 'flex items-center justify-between py-2 border-b border-zinc-800 last:border-0';
          element.innerHTML = `
            <div class="flex items-center gap-3">
              <img src="${item.image}" alt="${item.name}" class="w-10 h-10 object-contain bg-zinc-950 rounded-lg p-1 border border-zinc-800">
              <div>
                <h4 class="text-xs font-bold text-gray-200">${item.name}</h4>
                <p class="text-[10px] text-zinc-500">${item.price} ₴ / шт</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <div class="bg-zinc-800 border border-zinc-700 rounded-lg flex items-center p-0.5">
                <button onclick="removeFromCart(${item.id}); renderCartItems();" class="w-6 h-6 flex items-center justify-center text-red-400 font-bold text-xs">-</button>
                <span class="px-2 text-xs font-bold text-gray-200 min-w-[18px] text-center">${count}</span>
                <button onclick="addToCart(${item.id}); renderCartItems();" class="w-6 h-6 flex items-center justify-center text-amber-500 font-bold text-xs">+</button>
              </div>
              <span class="text-xs font-extrabold text-amber-500 min-w-[55px] text-right">${item.price * count} ₴</span>
            </div>
          `;
          container.appendChild(element);
        }
      });
      if (!hasItems) {
        container.innerHTML = `<div class="text-center text-zinc-500 py-6 text-xs">Кошик порожній 😞</div>`;
      }
    }

    // Запуск оформлення замовлення (Захищений Master-метод)
    function sendOrderToPoster() {
      try {
        logDebug("Запуск оформлення замовлення...");
        
        const phoneInput = document.getElementById('cust-phone').value.trim();
        if (!phoneInput) {
          showValidationTip("Будь ласка, введіть ваш номер телефону.");
          return;
        }

        let total = 0;
        let items = [];
        Object.keys(cart).forEach(id => {
          const item = menuData.find(m => m.id == id);
          if (item) {
            total += item.price * cart[id];
            items.push({
              product_id: item.id,
              name: item.name,
              price: item.price,
              count: cart[id]
            });
          }
        });

        if (items.length === 0) {
          showValidationTip("Кошик порожній!");
          logDebug("Спроба відправити порожній кошик відхилена.");
          return;
        }

        let userId = 0;
        let username = 'Guest';
        try {
          if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id || 0;
            username = tg.initDataUnsafe.user.username || 'Guest';
          }
        } catch (e) {
          logDebug("Не вдалося зчитати дані користувача TG: " + e.message);
        }

        const orderPayload = {
          total_amount: total,
          phone: phoneInput,
          items: items,
          user_id: userId,
          username: username
        };

        logDebug("Сформовано JSON-пакет замовлення: " + JSON.stringify(orderPayload));

        // Спроба відправити дані назад у Telegram-бот
        let sentSuccessfully = false;
        try {
          if (tg && tg.sendData) {
            logDebug("Виклик tg.sendData...");
            tg.sendData(JSON.stringify(orderPayload));
            sentSuccessfully = true;
            logDebug("Дані успішно передано до tg.sendData!");
          } else {
            logDebug("tg.sendData недоступний (Web App запущено не як клавіатурна кнопка).");
          }
        } catch (e) {
          logDebug("Збій tg.sendData (перехоплено): " + e.message);
        }

        // Відображаємо кастомне вікно успіху
        const modalPhone = document.getElementById('modal-phone-val');
        const modalTotal = document.getElementById('modal-total-val');
        const modalText = document.getElementById('modal-success-text');
        const modal = document.getElementById('custom-success-modal');

        if (modalPhone) modalPhone.innerText = phoneInput;
        if (modalTotal) modalTotal.innerText = `${total} ₴`;
        
        const countLabel = items.length === 1 ? '1 страва' : `${items.length} страви/а`;
        if (modalText) {
          modalText.innerHTML = `Тестове замовлення (${countLabel}) успішно сформоване!<br>Дані готові для передачі на кухню.`;
        }

        if (modal) {
          modal.classList.remove('hidden');
          logDebug("Кастомне вікно успіху виведено на екран.");
        }

        // Очищаємо кошик ТІЛЬКИ ПІСЛЯ успішного формування замовлення
        cart = {};
        renderMenu();
        
        const drawer = document.getElementById('cart-drawer');
        if (drawer) {
          drawer.classList.add('translate-y-full');
        }

      } catch (masterError) {
        logDebug("Критичний збій методу sendOrderToPoster: " + masterError.message);
        alert("Помилка виконання скрипта: " + masterError.message);
      }
    }

    function closeSuccessModal() {
      document.getElementById('custom-success-modal').classList.add('hidden');
      if (tg) {
        try {
          tg.close(); // Закриваємо Web App після ознайомлення
        } catch (e) {
          logDebug("Не вдалося закрити Web App: " + e.message);
        }
      }
    }

    function showValidationTip(message) {
      const existing = document.getElementById('val-tip');
      if (existing) existing.remove();

      const tip = document.createElement('div');
      tip.id = 'val-tip';
      tip.className = 'fixed top-16 left-4 right-4 bg-red-600 text-white font-semibold text-xs px-4 py-3 rounded-xl shadow-lg z-[150] text-center';
      tip.innerText = message;
      document.body.appendChild(tip);

      setTimeout(() => { tip.remove(); }, 3000);
    }

    window.onload = renderMenu;
  </script>
</body>
</html>
